name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pronunciation clips are gitignored (not in the repo), so pull them into
      # public/audio/ before the build copies public/ into out/. Cached by the
      # vocab hash, so this only re-downloads when the word list changes.
      - name: Cache pronunciation clips
        uses: actions/cache@v4
        with:
          path: public/audio
          key: audio-clips-${{ hashFiles('data/vocab.ts') }}

      - name: Fetch pronunciation clips
        run: node scripts/download-audio.mjs

      - name: Build static site
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gre-master-a2ec8
          channelId: live
