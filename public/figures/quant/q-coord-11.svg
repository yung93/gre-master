<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" fill="none">
  <!-- grid: 30 px per unit, origin at (140, 200) -->
  <g stroke="#ded9cf" stroke-width="1">
    <line x1="20" y1="20" x2="20" y2="260"/>
    <line x1="50" y1="20" x2="50" y2="260"/>
    <line x1="80" y1="20" x2="80" y2="260"/>
    <line x1="110" y1="20" x2="110" y2="260"/>
    <line x1="170" y1="20" x2="170" y2="260"/>
    <line x1="200" y1="20" x2="200" y2="260"/>
    <line x1="230" y1="20" x2="230" y2="260"/>
    <line x1="260" y1="20" x2="260" y2="260"/>
    <line x1="20" y1="20" x2="260" y2="20"/>
    <line x1="20" y1="50" x2="260" y2="50"/>
    <line x1="20" y1="80" x2="260" y2="80"/>
    <line x1="20" y1="110" x2="260" y2="110"/>
    <line x1="20" y1="140" x2="260" y2="140"/>
    <line x1="20" y1="170" x2="260" y2="170"/>
    <line x1="20" y1="230" x2="260" y2="230"/>
    <line x1="20" y1="260" x2="260" y2="260"/>
  </g>

  <!-- axes -->
  <line x1="20" y1="200" x2="260" y2="200" stroke="#2e2a24" stroke-width="1.5"/>
  <line x1="140" y1="20" x2="140" y2="260" stroke="#2e2a24" stroke-width="1.5"/>
  <text x="266" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#2e2a24">x</text>
  <text x="136" y="14" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#2e2a24">y</text>

  <!-- line k through (−2, 0) and (0, 4) -->
  <line x1="50" y1="260" x2="170" y2="20" stroke="#15798a" stroke-width="2.2"/>
  <text x="178" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#15798a">k</text>

  <!-- labeled points -->
  <circle cx="80" cy="200" r="4" fill="#2e2a24"/>
  <text x="72" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2e2a24">(&#8722;2, 0)</text>
  <circle cx="140" cy="80" r="4" fill="#2e2a24"/>
  <text x="152" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2e2a24">(0, 4)</text>
</svg>
