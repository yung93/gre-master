<svg xmlns="http://www.w3.org/2000/svg" width="380" height="230" viewBox="0 0 380 230" fill="none">
  <text x="50" y="14" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6e675c">High temperature (&#176;C)</text>

  <!-- gridlines (0–25 in steps of 5; 6.8 px per unit) -->
  <g stroke="#ded9cf" stroke-width="1">
    <line x1="50" y1="156" x2="360" y2="156"/>
    <line x1="50" y1="122" x2="360" y2="122"/>
    <line x1="50" y1="88" x2="360" y2="88"/>
    <line x1="50" y1="54" x2="360" y2="54"/>
    <line x1="50" y1="20" x2="360" y2="20"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6e675c" text-anchor="end">
    <text x="42" y="194">0</text>
    <text x="42" y="160">5</text>
    <text x="42" y="126">10</text>
    <text x="42" y="92">15</text>
    <text x="42" y="58">20</text>
    <text x="42" y="24">25</text>
  </g>

  <!-- series: Mon 12, Tue 18, Wed 15, Thu 21, Fri 18, Sat 24 -->
  <polyline points="70,108.4 124,67.6 178,88 232,47.2 286,67.6 340,26.8" stroke="#15798a" stroke-width="2"/>
  <g fill="#15798a">
    <circle cx="70" cy="108.4" r="3.5"/>
    <circle cx="124" cy="67.6" r="3.5"/>
    <circle cx="178" cy="88" r="3.5"/>
    <circle cx="232" cy="47.2" r="3.5"/>
    <circle cx="286" cy="67.6" r="3.5"/>
    <circle cx="340" cy="26.8" r="3.5"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2e2a24" text-anchor="middle">
    <text x="70" y="98">12</text>
    <text x="124" y="58">18</text>
    <text x="178" y="106">15</text>
    <text x="232" y="38">21</text>
    <text x="286" y="86">18</text>
    <text x="340" y="18">24</text>
  </g>

  <!-- axes -->
  <path d="M50 20 V190 H360" stroke="#2e2a24" stroke-width="1.5"/>

  <!-- day labels -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2e2a24" text-anchor="middle">
    <text x="70" y="210">Mon</text>
    <text x="124" y="210">Tue</text>
    <text x="178" y="210">Wed</text>
    <text x="232" y="210">Thu</text>
    <text x="286" y="210">Fri</text>
    <text x="340" y="210">Sat</text>
  </g>
</svg>
