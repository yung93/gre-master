<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240" viewBox="0 0 380 240" fill="none">
  <text x="50" y="14" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6e675c">Sales ($ thousands)</text>

  <!-- gridlines and y-axis labels (0–40 in steps of 10; 4 px per unit) -->
  <g stroke="#ded9cf" stroke-width="1">
    <line x1="50" y1="150" x2="360" y2="150"/>
    <line x1="50" y1="110" x2="360" y2="110"/>
    <line x1="50" y1="70" x2="360" y2="70"/>
    <line x1="50" y1="30" x2="360" y2="30"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6e675c" text-anchor="end">
    <text x="42" y="194">0</text>
    <text x="42" y="154">10</text>
    <text x="42" y="114">20</text>
    <text x="42" y="74">30</text>
    <text x="42" y="34">40</text>
  </g>

  <!-- bars: Jan 20, Feb 35, Mar 25, Apr 40, May 30 -->
  <g fill="#15798a">
    <rect x="66" y="110" width="36" height="80"/>
    <rect x="126" y="50" width="36" height="140"/>
    <rect x="186" y="90" width="36" height="100"/>
    <rect x="246" y="30" width="36" height="160"/>
    <rect x="306" y="70" width="36" height="120"/>
  </g>

  <!-- value labels -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2e2a24" text-anchor="middle">
    <text x="84" y="102">20</text>
    <text x="144" y="42">35</text>
    <text x="204" y="82">25</text>
    <text x="264" y="22">40</text>
    <text x="324" y="62">30</text>
  </g>

  <!-- axes -->
  <path d="M50 20 V190 H360" stroke="#2e2a24" stroke-width="1.5"/>

  <!-- month labels -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2e2a24" text-anchor="middle">
    <text x="84" y="210">Jan</text>
    <text x="144" y="210">Feb</text>
    <text x="204" y="210">Mar</text>
    <text x="264" y="210">Apr</text>
    <text x="324" y="210">May</text>
  </g>
</svg>
