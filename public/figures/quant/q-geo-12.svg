<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" fill="none">
  <!-- parallel lines ℓ and m -->
  <line x1="40" y1="70" x2="320" y2="70" stroke="#2e2a24" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="150" x2="320" y2="150" stroke="#2e2a24" stroke-width="2" stroke-linecap="round"/>
  <text x="330" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#2e2a24">&#8467;</text>
  <text x="330" y="154" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#2e2a24">m</text>

  <!-- transversal crossing ℓ at (110,70) and m at (210,150) -->
  <line x1="60" y1="30" x2="260" y2="190" stroke="#2e2a24" stroke-width="2" stroke-linecap="round"/>

  <!-- 130° angle above ℓ, right of the transversal -->
  <path d="M134 70 A24 24 0 0 0 91.3 55" stroke="#6e675c" stroke-width="1.5"/>
  <text x="142" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2e2a24">130°</text>

  <!-- x° below m, right of the transversal -->
  <path d="M227.2 163.8 A22 22 0 0 0 232 150" stroke="#15798a" stroke-width="1.5"/>
  <text x="242" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#15798a">x°</text>

  <text x="180" y="204" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#6e675c">&#8467; &#8741; m &#183; Figure not drawn to scale</text>
</svg>
